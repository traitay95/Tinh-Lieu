name: Keep Streamlit App Alive

on:
  schedule:
    # Chạy mỗi 12 tiếng một lần (vào lúc 00:00 và 12:00 UTC)
    - cron: '0 */6 * * *'
  # Cho phép bạn bấm nút chạy thử thủ công trên giao diện GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET request to Streamlit
        run: |
          curl -sL -w "%{http_code}" "https://tinhlieu.streamlit.app" -o /dev/null

